<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="100" height="100" fill="#000000"/>
  <text x="28" y="68" font-family="Arial, Helvetica, sans-serif" font-size="56" font-weight="bold" fill="#DC2626">N</text>
  <text x="60" y="68" font-family="Arial, Helvetica, sans-serif" font-size="56" font-weight="bold" fill="#FFFFFF" filter="url(#glow)">L</text>
</svg>
