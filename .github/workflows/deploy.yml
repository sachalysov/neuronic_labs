name: Deploy to Timeweb

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Set up job
        run: echo "Starting deployment process"

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build project
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_CHAT_WEBHOOK_URL: ${{ secrets.VITE_CHAT_WEBHOOK_URL }}
          VITE_FORM_WEBHOOK_URL: ${{ secrets.VITE_FORM_WEBHOOK_URL }}
          VITE_BLOG_WEBHOOK_URL: ${{ secrets.VITE_BLOG_WEBHOOK_URL }}
        run: npm run build

      - name: Install rsync
        run: sudo apt-get update && sudo apt-get install -y rsync sshpass

      - name: Deploy to Timeweb via rsync
        env:
          TIMEWEB_PASS: ${{ secrets.TIMEWEB_PASS }}
        run: |
          # Добавляем хосты в known_hosts, чтобы избежать ошибки проверки ключа
          mkdir -p ~/.ssh
          ssh-keyscan -H neuroniclabs.ru >> ~/.ssh/known_hosts 2>/dev/null || true
          ssh-keyscan -H vh434.timeweb.ru >> ~/.ssh/known_hosts 2>/dev/null || true
          ssh-keyscan -H 87.249.38.179 >> ~/.ssh/known_hosts 2>/dev/null || true

          # Проверяем, что dist/ существует и содержит файлы
          if [ ! -d "dist" ] || [ -z "$(ls -A dist)" ]; then
            echo "Error: dist/ directory is empty or doesn't exist"
            exit 1
          fi

          # Запускаем rsync с паролем из secrets на домен neuroniclabs.ru
          # Деплоим содержимое dist/ в public_html (стандартная директория для веб-сайтов на Timeweb)
          sshpass -p "$TIMEWEB_PASS" rsync -avz --delete \
            --exclude='.bash*' \
            --exclude='.cache' \
            --exclude='.ssh' \
            --exclude='.*_history' \
            -e "ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=~/.ssh/known_hosts" \
            dist/. \
            cc374250@neuroniclabs.ru:~/public_html/

      - name: Deployment summary
        run: echo "✅ Deployment completed successfully"
