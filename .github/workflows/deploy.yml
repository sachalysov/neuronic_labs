name: Deploy to Timeweb

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Set up job
        run: echo "Starting deployment process"

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Install Puppeteer dependencies
        run: |
          sudo apt-get update
          # Устанавливаем зависимости для Puppeteer (совместимо с Ubuntu 24.04)
          # Используем подход с fallback для совместимости со старыми версиями Ubuntu
          sudo apt-get install -y \
            ca-certificates \
            fonts-liberation \
            libatk-bridge2.0-0 \
            libatk1.0-0 \
            libc6 \
            libcairo2 \
            libcups2 \
            libdbus-1-3 \
            libexpat1 \
            libfontconfig1 \
            libgbm1 \
            libgtk-3-0 \
            libnspr4 \
            libnss3 \
            libpango-1.0-0 \
            libpangocairo-1.0-0 \
            libstdc++6 \
            libx11-6 \
            libx11-xcb1 \
            libxcb1 \
            libxcomposite1 \
            libxcursor1 \
            libxdamage1 \
            libxext6 \
            libxfixes3 \
            libxi6 \
            libxrandr2 \
            libxrender1 \
            libxss1 \
            libxtst6 \
            lsb-release \
            wget \
            xdg-utils
          # Устанавливаем пакеты с учетом версии Ubuntu (24.04 использует t64 суффикс)
          sudo apt-get install -y libasound2t64 2>/dev/null || sudo apt-get install -y libasound2 || true
          sudo apt-get install -y libgcc-s1 2>/dev/null || sudo apt-get install -y libgcc1 || true
          sudo apt-get install -y libglib2.0-0t64 2>/dev/null || sudo apt-get install -y libglib2.0-0 || true

      - name: Verify environment variables
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: |
          echo "Checking environment variables..."
          if [ -z "$VITE_SUPABASE_URL" ]; then
            echo "❌ ERROR: VITE_SUPABASE_URL is not set"
            exit 1
          else
            echo "✓ VITE_SUPABASE_URL is set: ${VITE_SUPABASE_URL:0:30}..."
          fi
          if [ -z "$VITE_SUPABASE_ANON_KEY" ]; then
            echo "❌ ERROR: VITE_SUPABASE_ANON_KEY is not set"
            exit 1
          else
            echo "✓ VITE_SUPABASE_ANON_KEY is set: ${VITE_SUPABASE_ANON_KEY:0:20}..."
          fi

      - name: Build project with pre-rendering
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_CHAT_WEBHOOK_URL: ${{ secrets.VITE_CHAT_WEBHOOK_URL }}
          VITE_FORM_WEBHOOK_URL: ${{ secrets.VITE_FORM_WEBHOOK_URL }}
          VITE_BLOG_WEBHOOK_URL: ${{ secrets.VITE_BLOG_WEBHOOK_URL }}
        run: npm run build:prerender

      - name: Install rsync
        run: sudo apt-get update && sudo apt-get install -y rsync sshpass

      - name: Deploy to Timeweb via rsync
        env:
          TIMEWEB_PASS: ${{ secrets.TIMEWEB_PASS }}
        run: |
          # Добавляем хосты в known_hosts, чтобы избежать ошибки проверки ключа
          mkdir -p ~/.ssh
          ssh-keyscan -H neuroniclabs.ru >> ~/.ssh/known_hosts 2>/dev/null || true
          ssh-keyscan -H vh434.timeweb.ru >> ~/.ssh/known_hosts 2>/dev/null || true
          ssh-keyscan -H 87.249.38.179 >> ~/.ssh/known_hosts 2>/dev/null || true

          # Проверяем, что dist/ существует и содержит файлы
          if [ ! -d "dist" ] || [ -z "$(ls -A dist)" ]; then
            echo "Error: dist/ directory is empty or doesn't exist"
            exit 1
          fi

          # Запускаем rsync с паролем из secrets на домен neuroniclabs.ru
          # Деплоим содержимое dist/ в public_html (стандартная директория для веб-сайтов на Timeweb)
          sshpass -p "$TIMEWEB_PASS" rsync -avz --delete \
            --exclude='.bash*' \
            --exclude='.cache' \
            --exclude='.ssh' \
            --exclude='.*_history' \
            -e "ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=~/.ssh/known_hosts" \
            dist/. \
            cc374250@neuroniclabs.ru:~/public_html/

      - name: Deployment summary
        run: echo "✅ Deployment completed successfully"
