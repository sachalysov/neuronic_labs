name: Deploy to Timeweb

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Set up job
        run: echo "Starting deployment process"

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build project
        run: npm run build

      - name: Install rsync
        run: sudo apt-get update && sudo apt-get install -y rsync sshpass

      - name: Deploy to Timeweb via rsync
        env:
          TIMEWEB_PASS: ${{ secrets.TIMEWEB_PASS }}
        run: |
          # Добавляем хост в known_hosts, чтобы избежать ошибки проверки ключа
          mkdir -p ~/.ssh
          ssh-keyscan -H cc374250.tw1.ru >> ~/.ssh/known_hosts 2>/dev/null || true

          # Запускаем rsync с паролем из secrets
          sshpass -p "$TIMEWEB_PASS" rsync -avz --delete \
            -e "ssh -o StrictHostKeyChecking=no" \
            dist/ \
            cc374250.tw1.ru:~/public_html/

      - name: Deployment summary
        run: echo "Deployment completed successfully"

      - name: Post Setup Node.js
        run: echo "Cleanup complete"

      - name: Post Checkout code
        run: echo "Post checkout complete"

      - name: Complete job
        run: echo "Job completed"
