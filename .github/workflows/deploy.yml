name: Deploy to Timeweb

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build project
        run: npm run build

      - name: Install rsync
        run: sudo apt-get update && sudo apt-get install -y rsync sshpass

      - name: Deploy to Timeweb via rsync
        env:
          TIMEWEB_HOST: ${{ secrets.TIMEWEB_HOST }}
          TIMEWEB_USER: ${{ secrets.TIMEWEB_USER }}
          TIMEWEB_PASS: ${{ secrets.TIMEWEB_PASS }}
        run: |
          sshpass -p "$TIMEWEB_PASS" rsync -avz --delete \
            --exclude='.git*' \
            --exclude='node_modules' \
            dist/ "$TIMEWEB_USER@$TIMEWEB_HOST:/public_html/"

      - name: Deployment summary
        run: |
          echo "✅ Successfully deployed to Timeweb"
          echo "🌍 Site URL: https://${{ secrets.TIMEWEB_HOST }}"
